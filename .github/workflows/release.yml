# Builds a release when a version tag is pushed (git tag v0.2.0 && git push --tags),
# or by hand from the Actions tab:
#   reactc-linux-x64.tar.gz     the compiler with its runtime, libraries and tools (Linux)
#   reactc-windows-x64.zip      the same for Windows (builds run the toolchain in WSL)
#   reactc-threads-<v>.tgz,
#   reactc-ui-<v>.tgz           the libraries, installable with npm from the release URL
#   SHA256SUMS
# With an NPM_TOKEN secret it also publishes the libraries to the npm registry.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: Compiler for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - run: cargo test --locked --manifest-path compiler/Cargo.toml
      - run: cargo build --release --locked --manifest-path compiler/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: reactc-exe
          path: compiler/target/release/reactc.exe

  package:
    name: Packages
    needs: windows-exe
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools
          key: tools-${{ hashFiles('tools/install-*.sh', 'scripts/ci/install-tools.sh', 'toolchain.json') }}
      - run: sh scripts/ci/install-tools.sh --system
      # the toolchain's cc also links Rust build scripts (the container has no system C compiler)
      - run: echo "$PWD/tools/local/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - uses: actions/download-artifact@v4
        with:
          name: reactc-exe
          path: dist/windows-exe
      - name: Build both packages
        run: |
          export PATH="$PWD/tools/local/node-v22.16.0-linux-x64/bin:$PATH"
          node scripts/build-compiler.mjs --out dist/release/reactc-linux-x64 --smoke-native
          node scripts/build-compiler.mjs --os windows --exe dist/windows-exe/reactc.exe --dereference \
            --out dist/release/reactc-windows-x64
      - name: Archives, libraries and checksums
        run: |
          export PATH="$PWD/tools/local/node-v22.16.0-linux-x64/bin:$PATH"
          cd dist/release
          tar -czf reactc-linux-x64.tar.gz reactc-linux-x64
          zip -qry reactc-windows-x64.zip reactc-windows-x64
          npm pack ../../packages/reactc-threads ../../packages/reactc-ui
          sha256sum reactc-linux-x64.tar.gz reactc-windows-x64.zip *.tgz > SHA256SUMS
          ls -la
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/release/reactc-linux-x64.tar.gz
            dist/release/reactc-windows-x64.zip
            dist/release/*.tgz
            dist/release/SHA256SUMS
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: release-preview
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.tgz
            dist/release/SHA256SUMS
      - name: Publish libraries to npm
        if: startsWith(github.ref, 'refs/tags/') && env.NPM_TOKEN != ''
        run: |
          export PATH="$PWD/tools/local/node-v22.16.0-linux-x64/bin:$PATH"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --workspace @reactc/threads --access public
          npm publish --workspace @reactc/ui --access public

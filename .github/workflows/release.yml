# Builds a release when a version tag is pushed (git tag v0.2.0 && git push --tags),
# or by hand from the Actions tab:
#   reactc-linux-x64.tar.gz     the compiler with its runtime, libraries and tools (Linux)
#   reactc-windows-x64.zip      the same for Windows, with native tools and Node/npm
#   reactc.exe                 Windows compiler with first-use toolchain download
#   reactc-offline.exe         Windows compiler with the toolchain inside it
#   reactc-threads-<v>.tgz,
#   reactc-ui-<v>.tgz           the libraries, installable with npm from the release URL
#   SHA256SUMS
# With an NPM_TOKEN secret it also publishes the libraries to the npm registry.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    name: Native Windows package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - uses: actions/cache@v4
        with:
          path: |
            tools/mingw64
            tools/porffor
            tools/node-win
            tools/ada-win
            tools/http2-win
            tools/skia-win
          key: windows-native-${{ runner.os }}-${{ hashFiles('scripts/setup-native.mjs', 'tools/install-*.sh') }}
      - run: npm run setup -- --native
      - run: cargo test --locked --manifest-path compiler/Cargo.toml
      - run: node scripts/build-compiler.mjs --native-windows --out dist/release/reactc-windows-x64
      - name: Archive Windows package
        working-directory: dist/release
        run: tar.exe -a -cf reactc-windows-x64.zip reactc-windows-x64
      - name: Pack standalone executables
        run: |
          node scripts/pack-windows-exe.mjs compiler/target/release/reactc.exe dist/release/reactc-windows-x64.zip dist/release/reactc-offline.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/pack-windows-exe.mjs compiler/target/release/reactc.exe dist/release/reactc-windows-x64.zip dist/release/reactc.exe $env:GITHUB_REF_NAME
          }
      - name: Check standalone toolchain installation
        run: |
          $env:REACTC_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'reactc-standalone'
          $exe = (Resolve-Path dist/release/reactc-offline.exe).Path
          Push-Location $env:RUNNER_TEMP
          try {
            & $exe new --list
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/release/reactc-windows-x64.zip
            dist/release/*.exe
          compression-level: 0

  package:
    name: Packages
    needs: windows-package
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools
          key: tools-${{ hashFiles('tools/install-*.sh', 'scripts/ci/install-tools.sh', 'toolchain.json') }}
      - run: sh scripts/ci/install-tools.sh --system
      # the toolchain's cc also links Rust build scripts (the container has no system C compiler)
      - run: echo "$PWD/tools/local/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist/release
      - name: Build Linux package
        run: |
          export PATH="$PWD/tools/local/node-v22.16.0-linux-x64/bin:$PATH"
          node scripts/build-compiler.mjs --out dist/release/reactc-linux-x64 --smoke-native
      - name: Archives, libraries and checksums
        run: |
          export PATH="$PWD/tools/local/node-v22.16.0-linux-x64/bin:$PATH"
          cd dist/release
          tar -czf reactc-linux-x64.tar.gz reactc-linux-x64
          npm pack ../../packages/reactc-threads ../../packages/reactc-ui ../../packages/reactc-native
          sha256sum reactc-linux-x64.tar.gz reactc-windows-x64.zip *.exe *.tgz > SHA256SUMS
          ls -la
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/release/reactc-linux-x64.tar.gz
            dist/release/reactc-windows-x64.zip
            dist/release/*.exe
            dist/release/*.tgz
            dist/release/SHA256SUMS
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: release-preview
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.exe
            dist/release/*.tgz
            dist/release/SHA256SUMS
      - name: Publish libraries to npm
        if: startsWith(github.ref, 'refs/tags/') && env.NPM_TOKEN != ''
        run: |
          export PATH="$PWD/tools/local/node-v22.16.0-linux-x64/bin:$PATH"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --workspace @reactc/threads --access public
          npm publish --workspace @reactc/ui --access public
          npm publish --workspace @reactc/native --access public
